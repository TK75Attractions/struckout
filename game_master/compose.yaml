services:
  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ../
      dockerfile: ./game_master/Dockerfile
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 8020:8020

  db:
    image: mysql@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4 # 26.7.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1s

volumes:
  mysql_data:
