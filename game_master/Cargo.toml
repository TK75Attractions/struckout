[package]
name = "game_master"
version = "0.1.0"
edition.workspace = true

[dependencies]
struckout-proto = { workspace = true }

backon = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tokio-stream = { workspace = true, features = ["sync"] }
tonic = { workspace = true }
tonic-health = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "string"] }
derive_more = { workspace = true, features = ["from", "into"] }
parking_lot = { workspace = true }
sentry = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

sqlx = { workspace = true, features = ["migrate", "mysql", "runtime-tokio", "sqlx-toml", "time", "tls-rustls"] }
toml = { workspace = true }

[dev-dependencies]
testcontainers-modules = { workspace = true, features = ["mysql"] }

[build-dependencies]
struckout-utils = { workspace = true }

[features]
sentry = ["dep:sentry"]
