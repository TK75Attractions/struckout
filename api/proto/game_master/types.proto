// Primitive types shared across other proto files.
syntax = "proto3";

package tk75attractions.struckout.game_master.v1;

enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  DIFFICULTY_NORMAL = 1;
  DIFFICULTY_HARD = 2;
  DIFFICULTY_VERYHARD = 3;
}

enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;
  GAME_MODE_SINGLE = 1;
  GAME_MODE_MULTI = 2;
}

message PlayerInfo {
  message PlayerItem {
    uint32 machine_id = 1;
    uint32 player_id = 2;
    string player_name = 3;
  }

  message Single {
    PlayerItem player = 1;
  }

  message Multi {
    PlayerItem player_1 = 1;
    PlayerItem player_2 = 2;
  }

  oneof player_info_data {
    Single single = 2;
    Multi multi = 3;
  }
}
