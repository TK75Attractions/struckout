syntax = "proto3";

package tk75attractions.struckout.game_master.v1;

import "game_master/event.proto";
import "game_master/target.proto";
import "game_master/tutorial.proto";
import "game_master/types.proto";
import "google/protobuf/duration.proto";

message StartSessionRequest {
  uint32 machine_id = 1;
  uint32 player_id = 3;
}

message StartSessionResponse {}

message ListenEventsRequest {
  uint32 machine_id = 1;
}

message ListenEventsResponse {
  Event event = 1;
}

// FIXME: score_to_addじゃなくてtarget_idとかのほうが良いか？
message AddScoreRequest {
  uint32 machine_id = 1;
  uint32 score_to_add = 3;
}

message AddScoreResponse {}

message GetGameResultRequest {
  uint32 game_id = 1;
}

message GetGameResultResponse {
  uint32 total_score = 1;
}

message SetSessionDifficultyRequest {
  Difficulty difficulty = 1;
  uint32 machine_id = 2;
}

message SetSessionDifficultyResponse {}

message SetGameModeRequest {
  GameMode mode = 1;
  uint32 machine_id = 2;
}

message SetGameModeResponse {}

message SetSessionReadyRequest {
  uint32 machine_id = 1;
}

message SetSessionReadyResponse {}

// Service provided by `game_master`.
//
// ## Single-play
// | game-master |
// |  machine 1  | StartTutorial -- GoPreviousTutorial/GoNextTutorial -- StartSession -- SetSessionPlayer -- SetSessionDifficulty -- Ready |
//
// ## Multi-play
// | game-master | ------------------------------------------------------------------------------------------------ GameStarted |
// |  machine 1  | StartTutorial -- GoPreviousTutorial/GoNextTutorial -- StartSession ----- SetSessionPlayer -- SetSessionDifficulty ------ Ready ----- |
// |  machine 2  | ----- StartSession -- SetSessionPlayer -- SetSessionDifficulty -- Ready
//
// See also: docs/diagrams/data_flow.mmd
service GameMasterSessionService {
  // Used by `touchpanel`.
  // GameFinishedをtouchpanelが受け取ったらそちらから切断する。
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);

  // Sets difficulty to the session. Used by `touchpanel`.
  rpc SetSessionDifficulty(SetSessionDifficultyRequest) returns (SetSessionDifficultyResponse);

  rpc SetGameMode(SetGameModeRequest) returns (SetGameModeResponse);

  // Sets readiness to the session. Used by `touchpanel`.
  rpc SetSessionReady(SetSessionReadyRequest) returns (SetSessionReadyResponse);

  // Starts tutorial on the specified machine. Used by `touchpanel`.
  rpc StartTutorial(StartTutorialRequest) returns (StartTutorialResponse);

  // Navigates to the previous tutorial. Used by `touchpanel`.
  rpc GoPreviousTutorial(GoPreviousTutorialRequest) returns (GoPreviousTutorialResponse);

  // Navigates to the next tutorial. Used by `touchpanel`.
  rpc GoNextTutorial(GoNextTutorialRequest) returns (GoNextTutorialResponse);

  // Notify events occured in game_master.
  rpc ListenEvents(ListenEventsRequest) returns (stream ListenEventsResponse);

  // Adds score for the game. Used by `projector`.
  rpc AddScore(AddScoreRequest) returns (AddScoreResponse);

  // Gets the result of a specific game.
  rpc GetGameResult(GetGameResultRequest) returns (GetGameResultResponse);

  // Adds a target to a session. Used by `projector`
  rpc AddTarget(AddTargetRequest) returns (AddTargetResponse);

  // Removes a target from a session. Used by `projector`.
  rpc RemoveTarget(RemoveTargetRequest) returns (RemoveTargetResponse);
}
