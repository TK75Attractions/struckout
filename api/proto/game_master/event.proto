syntax = "proto3";

package tk75attractions.struckout.game_master.v1;

import "game_master/target.proto";
import "game_master/types.proto";
import "google/protobuf/duration.proto";

message Event {
  message SessionDifficultyChanged {
    Difficulty difficulty = 1;
  }

  message GameStarted {
    Difficulty difficulty = 1;
  }

  message GameTimeLimitNotify {
    google.protobuf.Duration remaining = 1;
  }

  message GameScoreChanged {
    uint32 total_score = 1;
  }

  message GameFinished {}

  /* ----- Tutorials ----- */
  message TutorialStarted {}

  message TutorialNavigatedToPrevious {}

  message TutorialNavigatedToNext {}

  /* ----- Targets ----- */
  message TargetAdded {
    Target target = 1;
  }

  message TargetRemoved {
    string target_id = 1;
  }

  // TODO: 機能追加したらコメントアウト外す
  // message TargetModified {}

  oneof event_data {
    GameStarted game_started = 1;
    GameTimeLimitNotify game_time_limit_notify = 2;
    GameFinished game_finished = 3;
    GameScoreChanged game_score_changed = 4;
    SessionDifficultyChanged session_difficulty_changed = 5;
    /* ----- Tutorials ----- */
    TutorialStarted tutorial_started = 6;
    TutorialNavigatedToPrevious tutorial_navigated_to_previous = 7;
    TutorialNavigatedToNext tutorial_navigated_to_next = 8;
    TargetAdded target_added = 9;
    TargetRemoved target_removed = 10;
  }
}

message ListenEventsRequest {
  uint32 machine_id = 1;
}

message ListenEventsResponse {
  Event event = 1;
}
