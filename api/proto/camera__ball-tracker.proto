syntax = "proto3";

package tk75attractions.struckout.v1;

option java_package = "com.taichi765.struckoutCameraApp.proto";

// UDPでカメラからサーバに送られるパケット
message DetectionsPacket {
  uint32 camera_id = 1;
  string session_id = 2;
  // UNIX epochからの経過時間 (ms)。端末の時計で付けた値
  int64 timestamp = 3;
  uint64 frame_id = 4;
  repeated Detection detections = 5;
  // フレームのセンサー時刻 (ns)。端末が付けた値を変換せずに入れる。0 は未対応の送信元
  int64 sensor_timestamp_ns = 6;
}

message Detection {
  int32 bbox_width = 1;
  int32 bbox_height = 2;
  double lay_x = 3;
  double lay_y = 4;
  double lay_z = 5;
  // TODO: 特徴量
  // 検出の中心の、解析画像 (センサーの向き) での位置。左上が (0, 0)、右下が (1, 1)。送らない送信元では 0
  float image_x = 6;
  float image_y = 7;
}

// センサー時刻がどの時計で付けられているか (Android の SENSOR_INFO_TIMESTAMP_SOURCE)
enum TimestampSource {
  TIMESTAMP_SOURCE_UNSPECIFIED = 0;
  // 単調に増えるが、ほかの時計とは正確には比べられない。おおよそ System.nanoTime() と同じ時計
  TIMESTAMP_SOURCE_UNKNOWN = 1;
  // SystemClock.elapsedRealtimeNanos() と同じ時計
  TIMESTAMP_SOURCE_REALTIME = 2;
}

// TCPでカメラからサーバに送られるパケット
message TcpClientPacket {
  message UpdateCameraPose {
    uint32 camera_id = 1;
    CameraPose camera_pose = 2;
  }

  // TimeSyncRequest への返事。時刻はどれも端末の時計 (ns)
  message TimeSyncResponse {
    uint64 sequence = 1;
    // 要求を受け取ったときの SystemClock.elapsedRealtimeNanos()
    int64 receive_elapsed_realtime_ns = 2;
    // 返事を送る直前の SystemClock.elapsedRealtimeNanos()
    int64 send_elapsed_realtime_ns = 3;
    // 上と同じ瞬間の System.nanoTime()
    int64 send_uptime_ns = 4;
  }

  // カメラの設定。接続した直後と、撮影の設定が分かった・変わったときに送る
  message CameraInfo {
    uint32 camera_id = 1;
    string device_model = 2;
    // "camerax" / "highspeed"
    string app_variant = 3;
    TimestampSource timestamp_source = 4;
    // 画像の最初の行と最後の行の露光開始の時刻の差 (ns)。取れないときは 0
    int64 rolling_shutter_skew_ns = 5;
    // 最後に見た露光時間 (ns)。取れないときは 0
    int64 exposure_time_ns = 6;
    // 解析画像の大きさ
    uint32 image_width = 7;
    uint32 image_height = 8;
    // アプリが視線の計算に使っている焦点距離 (解析画像の px)
    double focal_length_px = 9;
    double frame_rate = 10;
  }

  oneof data {
    UpdateCameraPose update_camera_pose = 1;
    TimeSyncResponse time_sync_response = 2;
    CameraInfo camera_info = 3;
  }
}

message CameraPose {
  double x = 1;
  double y = 2;
  double z = 3;
  double rotation_x_degrees = 4;
  double rotation_y_degrees = 5;
  double rotation_z_degrees = 6;
}

// PC で解析してもらうために、カメラが送る動画 (TCP の 5052 番)。
// 接続して VideoStreamServerPacket を受け取ったら、VideoStreamConfig を送り、そのあと VideoFrame を送り続ける。
// VideoStreamConfig は、設定が変わったときにも送り直してよい (同じ内容を何度送ってもよい)。
// 解析を PC に任せている間、カメラは DetectionsPacket を送らない。PC が同じ形の DetectionsPacket を作る。
message VideoStreamPacket {
  oneof data {
    VideoStreamConfig config = 1;
    VideoFrame frame = 2;
  }
}

message VideoStreamConfig {
  // TcpServerPacket.camera_id で割り当てられた番号
  uint32 camera_id = 1;
  // DetectionsPacket.session_id と同じ
  string session_id = 2;
  // 動画の形式。いまは "video/avc" (H.264 の Annex B) だけ
  string mime_type = 3;
  uint32 video_width = 4;
  uint32 video_height = 5;
  double frame_rate = 6;

  // 解析画像の大きさ。PC は動画をこの大きさに縮めてから解析する
  uint32 analysis_width = 7;
  uint32 analysis_height = 8;
  // 解析画像での内部パラメータ (px)。アプリが自分で解析するときに使う値と同じ
  double fx = 9;
  double fy = 10;
  double cx = 11;
  double cy = 12;
  // 端末の座標からカメラの座標への回転行列 (行優先で 9 個)。視線 (Detection.lay_*) は
  // R^T K^-1 (u, v, 1) で、u, v は検出の枠の中心 (整数に切り捨て)
  repeated double device_to_camera = 13;

  // 検出を受け付ける範囲。アプリの設定画面の Detection Area と同じ意味 (プレビューの各辺から無視する幅、%)
  double ignored_left_percent = 14;
  double ignored_top_percent = 15;
  double ignored_right_percent = 16;
  double ignored_bottom_percent = 17;

  // 解析の設定。アプリの ObjectTracker と同じ意味
  double accumulate_weight = 18;
  double binary_threshold = 19;
  double min_contour_area = 20;
  uint32 foreground_persistence_frames = 21;
  double min_color_shift = 22;
}

message VideoFrame {
  // エンコーダーが出したデータ (Annex B)
  bytes data = 1;
  // データが設定 (SPS/PPS) だけで、画像を含まない
  bool codec_config = 2;
  bool key_frame = 3;
  // フレームのセンサー時刻 (ns)。DetectionsPacket.sensor_timestamp_ns と同じ。codec_config では 0
  int64 sensor_timestamp_ns = 4;
  // UNIX epoch からの経過時間 (ms)。DetectionsPacket.timestamp と同じ。codec_config では 0
  int64 timestamp = 5;
}

// PC からカメラへ (TCP の 5052 番)。接続を受け付けたら 1 回送る
message VideoStreamServerPacket {
  // 解析を引き受ける。false のときカメラは切断して、自分で解析を続ける
  bool accepted = 1;
}

// TCPでサーバーからカメラに送られるパケット
message TcpServerPacket {
  // 端末の時計とサーバーの時計の差を測るための要求。端末は TimeSyncResponse を返す
  message TimeSyncRequest {
    uint64 sequence = 1;
  }

  oneof data {
    // assign a camera id to client.
    uint32 camera_id = 1;
    TimeSyncRequest time_sync_request = 2;
  }
}
