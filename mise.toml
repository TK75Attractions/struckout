min_version = "2026.10.3"
monorepo_root = true

[monorepo]
config_roots = ["camera", "game_master", "launcher", "touchpanel"]
lockfile = true

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "windows-x64",
  "windows-arm64",
  "macos-arm64",
]

[tools]
dotnet = "10"
rust = "latest"
python = "latest"
grpcurl = "latest"
protoc = "35.1"
buf = "latest"

# faster than default linker on Linux
mold = { version = "latest", os = ["linux"] }

[tasks."proto"]
dir = "{{ config_root }}"
# grpc_csharp_plugin は buf.gen.game-master.yaml が BSR の remote plugin を使うので、
# ローカルに用意するものは buf と protoc だけ。
run = [
  "buf generate --template buf.gen.ball-tracker.yaml",
  "buf generate --template buf.gen.game-master.yaml",
]
description = "Generate the committed C# from api/proto"

[tasks."proto:check"]
dir = "{{ config_root }}"
depends = ["proto"]
run = "git diff --exit-code -- projector/Assets/Scripts/ProtoBuf/Generated sandbox/testTcpCLI/Network/Protocol/Generated"
description = "Check the committed C# matches api/proto (regenerates in place)"

[tasks."patches:disable"]
run = """
    if [ -f ./patches.toml ]; then
        mv ./patches.toml ./patches.toml.bak
        echo "1" > ../.states/will_enable_patch
    fi
"""
dir = "{{ config_root }}/.cargo"
description = ".cargo/patches.tomlを一時的に退避する"

[tasks."patches:enable"]
run = """
    if [ -f ./patches.toml.bak ]; then
        mv ./patches.toml.bak ./patches.toml
    fi
"""
dir = "{{ config_root }}/.cargo"
description = "'patches:disable'で移動したファイルを元に戻す"

[tasks."patches:restore"]
run = """
    if [ -f .states/will_enable_patch ] && [ $(cat .states/will_enable_patch) = "1" ]; then
        mise run //:patches:enable
        echo "0" > .states/will_enable_patch
    fi
"""
dir = "{{ config_root }}"
description = "'.states/will_enable_patch'が1の場合'patches:enable'を実行する"

[tasks."patches:status"]
run = """
    if [ -f ./patches.toml ]; then
        echo "patch enabled"
    elif [ -f ./patches.toml.bak ]; then
        echo "patch disabled"
    else
        echo "no patch config"
    fi
"""
dir = "{{ config_root }}/.cargo"
description = ".cargo/patches.tomlの状態を表示する"

[tasks."generate-mermaid"]
run = """
  docker run --rm \
      --user "$(id -u):$(id -g)" \
      --volume "$PWD:/data" \
      ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:latest \
      -i data_flow.mmd \
      -o data_flow.svg
"""
description = ".mmdファイルから.svgを生成する"
dir = "{{ config_root }}/docs/diagrams/"
