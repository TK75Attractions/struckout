name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  cancel-in-progress: true
  group: release

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      short-hash: ${{ steps.info.outputs.short-hash }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install_args: protoc
      - name: Get commit hash and version of this release
        id: info
        run: |
            set -eux
            SHORT_HASH=$(mise exec protoc -- cargo xtask release short-hash)
            VERSION=$(mise exec protoc -- cargo xtask release next-version)
            mise exec protoc -- cargo xtask release projector-build-info \
              --version "${VERSION}" \
              --short-hash "${SHORT_HASH}"
            echo "short-hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload projector build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-build-info
          path: projector/Assets/Scripts/Unity/BuildInfo.Generated.cs

  rust-build:
    strategy:
      matrix:
        os: ["windows-2022", "macos-14", "ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    needs: [get-version]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-deps: 0
          sparse-checkout: |
            .cargo
            mise.toml
            mise.lock
            api/proto
            api/rust
            api/spec
            ball_tracker
            game_master
            migrations/mysql
            touchpanel
            xtask
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - uses: jdx/mise-action@b90b6cbe247d74ecfb150e2f246c091da4d5174f
        with:
          install_args: protoc
      - name: Install fontconfig for Linux
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Build
        run: |
            SQLX_OFFLINE=true \
            ST_COMMIT_SHORT_HASH=${{ needs.get-version.outputs.short-hash }} \
            ST_VERSION=${{ needs.get-version.outputs.version }} \
            mise exec protoc -- cargo build --release -p ball_tracker -p touchpanel --features sentry

      - name: Rename binaries
        id: triple
        run: |
          mkdir upload
          case ${{ matrix.os }} in
            "windows-2022")
              echo "triple=x86_64-windows" >> "$GITHUB_OUTPUT"
              mv target/release/ball_tracker.exe upload/ball-tracker-x86_64-windows
              mv target/release/touchpanel.exe upload/touchpanel-x86_64-windows
              ;;
            "macos-14")
              echo "triple=arm64-macos" >> "$GITHUB_OUTPUT"
              mv target/release/ball_tracker upload/ball-tracker-arm64-macos
              mv target/release/touchpanel upload/touchpanel-arm64-macos
              ;;
            "ubuntu-22.04")
              echo "triple=x86_64-linux" >> "$GITHUB_OUTPUT"
              mv target/release/ball_tracker upload/ball-tracker-x86_64-linux
              mv target/release/touchpanel upload/touchpanel-x86_64-linux
              ;;
            *)
              exit 1;;
          esac
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ steps.triple.outputs.triple }}
          path: ./upload/

  unity-build:
    runs-on: ubuntu-latest
    needs: [get-version]
    strategy:
      matrix:
        target-platform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projector
      - name: Download projector build information
        uses: actions/download-artifact@v8
        with:
          name: unity-build-info
          path: projector/Assets/Scripts/Unity
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projector/Library
          key: Library-${{ matrix.target-platform }}-${{ hashFiles('projector/Assets/**', 'projector/Packages/**', 'projector/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target-platform }}-
      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target-platform }}
          projectPath: projector
          gitPrivateToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine file suffix
        id: triple
        run: |
          case ${{ matrix.target-platform }} in
            "StandaloneWindows64")
              echo "triple=x86_64-windows" >> "$GITHUB_OUTPUT";;
            "StandaloneOSX")
              echo "triple=arm64-macos" >> "$GITHUB_OUTPUT";;
            "StandaloneLinux64")
              echo "triple=x86_64-linux" >> "$GITHUB_OUTPUT";;
            *)
              exit 1;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projector-${{ steps.triple.outputs.triple }}
          path: ./build/

  launcher-build:
    strategy:
      matrix:
        include:
          # The suffixes are the ones of the Rust binaries above (launcher/src/Struckout.Launcher.Core/Platform/HostPlatform.cs)
          - os: windows-2022
            rid: win-x64
            asset: struckout-launcher-x86_64-windows.exe
          # Built on macOS so that the SDK signs the binary (Apple Silicon refuses unsigned ones)
          - os: macos-14
            rid: osx-arm64
            asset: struckout-launcher-arm64-macos
          - os: ubuntu-22.04
            rid: linux-x64
            asset: struckout-launcher-x86_64-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            api/spec
            launcher
            mise.toml
            mise.lock
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: launcher
          install_args: dotnet
      - name: Publish
        run: |
          dotnet publish launcher/src/Struckout.Launcher -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          mkdir upload
          case ${{ matrix.rid }} in
            win-*) mv publish/struckout-launcher.exe upload/${{ matrix.asset }};;
            *) mv publish/struckout-launcher upload/${{ matrix.asset }};;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-${{ matrix.rid }}
          path: ./upload/

  camera-build:
    runs-on: ubuntu-latest
    # The signing key is a secret of the repository
    if: ${{ github.repository == 'TK75Attractions/struckout' }}
    defaults:
      run:
        working-directory: camera/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            camera
            api/proto
            mise.toml
            mise.lock
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: camera
          install_args: java protoc python
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera/opencv
          key: opencv-${{ hashFiles('camera/opencv/**') }}
      - name: Install OpenCV
        if: ${{ steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: mise run install-opencv
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The launcher updates the app with `adb install -r`, which needs the same key in every release.
      # Create the secrets with:
      #   keytool -genkeypair -keystore camera.jks -alias camera -keyalg RSA -keysize 4096 -validity 10000
      #   base64 -w0 camera.jks  # CAMERA_KEYSTORE_BASE64
      - name: Build
        run: |
          if [ -z "$CAMERA_KEYSTORE_BASE64" ]; then
            echo "CAMERA_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          export CAMERA_KEYSTORE_FILE="$RUNNER_TEMP/camera.jks"
          echo "$CAMERA_KEYSTORE_BASE64" | base64 -d > "$CAMERA_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease
          mkdir -p ../upload
          mv app/build/outputs/apk/release/app-release.apk ../upload/camera.apk
        env:
          CAMERA_KEYSTORE_BASE64: ${{ secrets.CAMERA_KEYSTORE_BASE64 }}
          CAMERA_KEYSTORE_PASSWORD: ${{ secrets.CAMERA_KEYSTORE_PASSWORD }}
          CAMERA_KEY_ALIAS: ${{ secrets.CAMERA_KEY_ALIAS }}
          CAMERA_KEY_PASSWORD: ${{ secrets.CAMERA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera
          path: ./upload/

  publish-game-master-image:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Tk75Attractions/struckout' && github.ref_name == 'master' }}
    needs: [get-version]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/game-master
          tags: type=raw,value=${{ needs.get-version.outputs.version }}
      - name: Build and push game-master image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./game_master/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=game-master
          cache-to: type=gha,mode=max,scope=game-master
          build-args: |
            ST_VERSION=${{ needs.get-version.outputs.version }}
            ST_COMMIT_SHORT_HASH=${{ needs.get-version.outputs.short-hash }}

  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}
    needs: [get-version, rust-build, unity-build, launcher-build, camera-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .
      - name: Download projector artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: projector-*
          skip-decompress: true # zipファイルのまま
      - name: Download rust artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rust-*
      - name: Download launcher artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: launcher-*
      - name: Download camera artifact
        uses: actions/download-artifact@v8
        with:
          name: camera
          path: camera
      - name: Create release
        run: |
          gh release create ${{ needs.get-version.outputs.version }} \
            rust-x86_64-windows/* rust-x86_64-linux/* rust-arm64-macos/* \
            launcher-*/* camera/camera.apk \
            projector-arm64-macos/projector-arm64-macos.zip \
            projector-x86_64-windows/projector-x86_64-windows.zip \
            projector-x86_64-linux/projector-x86_64-linux.zip
        env:
          GH_TOKEN: ${{ github.token }}
