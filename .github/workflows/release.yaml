name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GAME_MASTER_IMAGE: ghcr.io/tk75attractions/game-master

concurrency:
  cancel-in-progress: true
  group: release

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      short-hash: ${{ steps.info.outputs.short-hash }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          install_args: protoc mold
      - name: Get commit hash and version of this release
        id: info
        run: |
            set -eux
            SHORT_HASH=$(mise exec protoc mold -- cargo xtask release short-hash)
            VERSION=$(mise exec protoc mold -- cargo xtask release next-version)
            mise exec protoc mold -- cargo xtask release projector-build-info \
              --version "${VERSION}" \
              --short-hash "${SHORT_HASH}"
            echo "short-hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload projector build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-build-info
          path: projector/Assets/Scripts/Unity/BuildInfo.Generated.cs

  rust-build:
    strategy:
      matrix:
        os: ["windows-2022", "windows-11-arm", "macos-14", "ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    needs: [get-version]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-deps: 0
          sparse-checkout: |
            .cargo
            mise.toml
            mise.lock
            api/proto
            api/rust
            api/spec
            ball_tracker
            game_master
            migrations/mysql
            touchpanel
            xtask
            macros
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          install_args: protoc ${{ matrix.os == 'ubuntu-22.04' && 'mold' }}
      - name: Install fontconfig for Linux
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Build ball_tracker
        run: mise exec protoc ${{ matrix.os == 'ubuntu-22.04' && 'mold' }} -- cargo build --profile release-tracker -p ball_tracker --features sentry
        env:
          SQLX_OFFLINE: "true"
          ST_COMMIT_SHORT_HASH: ${{ needs.get-version.outputs.short-hash }}
          ST_VERSION: ${{ needs.get-version.outputs.version }}
      - name: Build touchpanel
        run: mise exec protoc ${{ matrix.os == 'ubuntu-22.04' && 'mold' }} -- cargo build --release -p touchpanel --features sentry
        env:
          SQLX_OFFLINE: "true"
          ST_COMMIT_SHORT_HASH: ${{ needs.get-version.outputs.short-hash }}
          ST_VERSION: ${{ needs.get-version.outputs.version }}

      - name: Rename binaries
        id: triple
        run: |
          mkdir upload
          case ${{ matrix.os }} in
            "windows-2022")
              echo "triple=x86_64-windows" >> "$GITHUB_OUTPUT"
              mv target/release-tracker/ball_tracker.exe upload/ball-tracker-x86_64-windows
              mv target/release/touchpanel.exe upload/touchpanel-x86_64-windows
              ;;
            "windows-11-arm")
              echo "triple=arm64-windows" >> "$GITHUB_OUTPUT"
              mv target/release-tracker/ball_tracker.exe upload/ball-tracker-arm64-windows
              mv target/release/touchpanel.exe upload/touchpanel-arm64-windows
              ;;
            "macos-14")
              echo "triple=arm64-macos" >> "$GITHUB_OUTPUT"
              mv target/release-tracker/ball_tracker upload/ball-tracker-arm64-macos
              mv target/release/touchpanel upload/touchpanel-arm64-macos
              ;;
            "ubuntu-22.04")
              echo "triple=x86_64-linux" >> "$GITHUB_OUTPUT"
              mv target/release-tracker/ball_tracker upload/ball-tracker-x86_64-linux
              mv target/release/touchpanel upload/touchpanel-x86_64-linux
              ;;
            *)
              exit 1;;
          esac
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ steps.triple.outputs.triple }}
          path: ./upload/

  unity-build:
    runs-on: ubuntu-latest
    needs: [get-version]
    strategy:
      matrix:
        include:
          - target-platform: StandaloneWindows64
            triple: x86_64-windows
            build-method: ""
          - target-platform: StandaloneWindows64
            triple: arm64-windows
            build-method: Editor.ReleaseBuild.BuildWindowsArm64
          - target-platform: StandaloneLinux64
            triple: x86_64-linux
            build-method: ""
          - target-platform: StandaloneOSX
            triple: arm64-macos
            build-method: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projector
      - name: Download projector build information
        uses: actions/download-artifact@v8
        with:
          name: unity-build-info
          path: projector/Assets/Scripts/Unity
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projector/Library
          key: Library-${{ matrix.triple }}-${{ hashFiles('projector/Assets/**', 'projector/Packages/**', 'projector/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.triple }}-
      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: ${{ matrix.target-platform }}
          buildMethod: ${{ matrix.build-method }}
          projectPath: projector
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projector-${{ matrix.triple }}
          path: ./build/

  launcher-build:
    strategy:
      matrix:
        include:
          # The suffixes are the ones of the Rust binaries above (launcher/src/Struckout.Launcher.Core/Platform/HostPlatform.cs)
          - os: windows-2022
            rid: win-x64
            asset: struckout-launcher-x86_64-windows.exe
          - os: windows-11-arm
            rid: win-arm64
            asset: struckout-launcher-arm64-windows.exe
          # Built on macOS so that the SDK signs the binary (Apple Silicon refuses unsigned ones)
          - os: macos-14
            rid: osx-arm64
            asset: struckout-launcher-arm64-macos
          - os: ubuntu-22.04
            rid: linux-x64
            asset: struckout-launcher-x86_64-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            api/spec
            launcher
            mise.toml
            mise.lock
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: launcher
          install_args: dotnet
      - name: Publish
        run: |
          dotnet publish launcher/src/Struckout.Launcher -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          mkdir upload
          case ${{ matrix.rid }} in
            win-*) mv publish/struckout-launcher.exe upload/${{ matrix.asset }};;
            *) mv publish/struckout-launcher upload/${{ matrix.asset }};;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-${{ matrix.rid }}
          path: ./upload/

  camera-build:
    runs-on: ubuntu-latest
    needs: [get-version]
    # The signing key is a secret of the repository
    if: ${{ github.repository == 'TK75Attractions/struckout' && github.ref_name == 'master' }}
    defaults:
      run:
        working-directory: camera/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            camera
            api/proto
            mise.toml
            mise.lock
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: camera
          install_args: java protoc python
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera/opencv
          key: opencv-${{ hashFiles('camera/opencv/**') }}
      - name: Install OpenCV
        if: ${{ steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: mise run install-opencv
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The launcher updates the app with `adb install -r`, which needs the same key in every release.
      # Create the secrets with:
      #   keytool -genkeypair -keystore camera.jks -alias camera -keyalg RSA -keysize 4096 -validity 10000
      #   base64 -w0 camera.jks  # CAMERA_KEYSTORE_BASE64
      - name: Build
        run: |
          if [ -z "$CAMERA_KEYSTORE_BASE64" ]; then
            echo "CAMERA_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          export CAMERA_KEYSTORE_FILE="$RUNNER_TEMP/camera.jks"
          echo "$CAMERA_KEYSTORE_BASE64" | base64 -d > "$CAMERA_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease
          mkdir -p ../upload
          mv app/build/outputs/apk/release/app-release.apk ../upload/camera.apk
        env:
          CAMERA_KEYSTORE_BASE64: ${{ secrets.CAMERA_KEYSTORE_BASE64 }}
          CAMERA_KEYSTORE_PASSWORD: ${{ secrets.CAMERA_KEYSTORE_PASSWORD }}
          CAMERA_KEY_ALIAS: ${{ secrets.CAMERA_KEY_ALIAS }}
          CAMERA_KEY_PASSWORD: ${{ secrets.CAMERA_KEY_PASSWORD }}
          ST_VERSION: ${{ needs.get-version.outputs.version }}
          ST_COMMIT_SHORT_HASH: ${{ needs.get-version.outputs.short-hash }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera
          path: ./upload/

  build-game-master-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    if: ${{ github.repository == 'Tk75Attractions/struckout' && github.ref_name == 'master' }}
    needs: [get-version]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GAME_MASTER_IMAGE }}
          tags: type=raw,value=${{ needs.get-version.outputs.version }}
      - name: Build and push game-master image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./game_master/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GAME_MASTER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=game-master-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=game-master-${{ matrix.arch }}
          build-args: |
            ST_VERSION=${{ needs.get-version.outputs.version }}
            ST_COMMIT_SHORT_HASH=${{ needs.get-version.outputs.short-hash }}
            RELEASE_MODE=true
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/game-master-digests"
          touch "$RUNNER_TEMP/game-master-digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-master-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/game-master-digests/*
          if-no-files-found: error

  publish-game-master-image:
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'Tk75Attractions/struckout' && github.ref_name == 'master' }}
    needs: [get-version, build-game-master-image]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: game-master-digest-*
          path: ${{ runner.temp }}/game-master-digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GAME_MASTER_IMAGE }}
          tags: type=raw,value=${{ needs.get-version.outputs.version }}
      - name: Publish multi-platform game-master image
        working-directory: ${{ runner.temp }}/game-master-digests
        env:
          IMAGE_NAME: ${{ env.GAME_MASTER_IMAGE }}
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "$IMAGE_TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_TAG"

  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}
    needs: [get-version, rust-build, unity-build, launcher-build, camera-build, publish-game-master-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .
      - name: Download projector artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: projector-*
          skip-decompress: true # zipファイルのまま
      - name: Download rust artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rust-*
      - name: Download launcher artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: launcher-*
      - name: Download camera artifact
        uses: actions/download-artifact@v8
        with:
          name: camera
          path: camera
      - name: Create release
        run: |
          gh release create ${{ needs.get-version.outputs.version }} --generate-notes \
            rust-x86_64-windows/* rust-arm64-windows/* rust-x86_64-linux/* rust-arm64-macos/* \
            launcher-*/* camera/camera.apk \
            projector-arm64-macos/projector-arm64-macos.zip \
            projector-x86_64-windows/projector-x86_64-windows.zip \
            projector-arm64-windows/projector-arm64-windows.zip \
            projector-x86_64-linux/projector-x86_64-linux.zip
        env:
          GH_TOKEN: ${{ github.token }}
