name: Proto CI

on:
  workflow_call:

jobs:
  proto:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'TK75Attractions/struckout' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          install_args: buf protoc
      - name: Generate C# from *.proto
        run: mise run proto
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(projector): Re-generate code from *.proto" || exit 0
          git push
