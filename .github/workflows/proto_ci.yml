name: Proto CI

on:
  push:
    branches: master
    paths:
      - api/proto/**
      - projector/Assets/Scripts/ProtoBuf/Generated/**
      - sandbox/testTcpCLI/Network/Protocol/Generated/**
      - buf.gen.*.yaml
      - mise.toml
      - mise.lock
      - .github/workflows/proto_ci.yml
  pull_request:
    branches: master
    paths:
      - api/proto/**
      - projector/Assets/Scripts/ProtoBuf/Generated/**
      - sandbox/testTcpCLI/Network/Protocol/Generated/**
      - buf.gen.*.yaml
      - mise.toml
      - mise.lock
      - .github/workflows/proto_ci.yml
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'TK75Attractions/struckout' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: buf protoc
      - name: Generate C# from *.proto
        run: mise run proto
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(projector): Re-generate code from *.proto" || exit 0
          git push
