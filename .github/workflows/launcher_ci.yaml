name: Launcher CI

on:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            api/proto/ball_tracker
            api/spec
            launcher
            mise.toml
            mise.lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: launcher
          install_args: dotnet
      - name: Check format
        run: dotnet format Struckout.Launcher.slnx --verify-no-changes
      - name: Build
        run: dotnet build Struckout.Launcher.slnx
      - name: Run tests
        run: dotnet test --solution Struckout.Launcher.slnx
