name: Rust check

on: 
  push:
    branches: main
  pull_request:
    branches: main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Install protoc
        run:
          mise install protoc
      - name: Run check 
        run:
          mise exec protoc -- cargo check --all-targets
      - name: Run tests
        run:
          mise exec protoc -- cargo test
