name: Rust check

on: 
  push:
    branches: main
  pull_request:
    branches: main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run check 
        run:
          cargo check --all-targets
      - name: Run tests
        run:
          cargo test
