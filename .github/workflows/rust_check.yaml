name: Rust check

on:
  push:
    branches: master
    paths:
      - .cargo/**
      - mise.toml
      - mise.lock
      - api/proto/**
      - api/rust/**
      - api/spec/**
      - ball_tracker/**
      - game_master/**
      - migrations/mysql/**
      - touchpanel/**
      - xtask/**
      - .github/workflows/rust_check.yaml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    branches: master
    paths:
      - .cargo/**
      - .mise/**
      - api/proto/**
      - api/rust/**
      - api/spec/**
      - ball_tracker/**
      - game_master/**
      - migrations/mysql/**
      - touchpanel/**
      - xtask/**
      - .github/workflows/rust_check.yaml
      - Cargo.toml
      - Cargo.lock

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .cargo
            mise.toml
            mise.lock
            api/proto
            api/rust
            api/spec
            ball_tracker
            game_master
            migrations/mysql
            touchpanel
            xtask
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: protoc mold python
      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Run custom lints
        run: mise run //game-master:lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - name: Run check
        run: |
          SQLX_OFFLINE=true mise exec protoc mold -- cargo check --all-targets -p touchpanel -p ball_tracker -p game_master
      - name: Run tests
        run: |
          SQLX_OFFLINE=true mise exec protoc mold -- cargo test -p touchpanel -p ball_tracker -p game_master
