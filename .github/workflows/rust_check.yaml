name: Rust check

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .cargo
            mise.toml
            mise.lock
            api/proto
            api/rust
            api/spec
            ball_tracker
            game_master
            migrations/mysql
            touchpanel
            xtask
            macros
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          install_args: protoc mold python
      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Run custom lints
        run: mise run //game_master:lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - name: Run check
        run: |
          SQLX_OFFLINE=true mise exec protoc mold -- cargo check --all-targets -p touchpanel -p ball_tracker -p game_master
      - name: Run tests
        run: |
          SQLX_OFFLINE=true mise exec protoc mold -- cargo test -p touchpanel -p ball_tracker -p game_master
