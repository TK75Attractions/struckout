name: Android CI

on:
  push: 
    branches: master
    paths: 
      - camera/**
      - api/proto/**
      - .github/workflows/android_ci.yaml
      - .mise/**
  pull_request:
    branches: master
    paths:
      - camera/**
      - api/proto/**
      - .github/workflows/android_ci.yaml
      - .mise/**
  workflow_dispatch: 

jobs:
  android_ci:
    name: Android CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            camera
            api/proto
            .mise
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java protoc python
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera/opencv
          key: opencv-${{ hashFiles('camera/opencv/**') }}
      - name: Install OpenCV
        if: ${{ steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: mise run install-opencv
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: check
        run: ./gradlew :app:check
