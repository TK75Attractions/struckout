name: Android CI

on:
  push: 
    branches: master
    paths: 
      - struckoutCameraApp/**
      - api/proto/**
      - .github/workflows/android_ci.yaml
  pull_request:
    branches: master
    paths:
      - struckoutCameraApp/**
      - api/proto/**
      - .github/workflows/android_ci.yaml
  workflow_dispatch: 

jobs:
  android_ci:
    name: Android CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: struckoutCameraApp/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            struckoutCameraApp
            api/proto
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install protoc
        run: sudo apt install -y protobuf-compiler
      - name: check
        run: ./gradlew :app:check
