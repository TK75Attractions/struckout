name: Android CI

on:
  workflow_call:

jobs:
  android_ci:
    name: Android CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            camera
            api/proto
            mise.toml
            mise.lock
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          working_directory: camera
          install_args: java protoc python
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera/opencv
          key: opencv-${{ hashFiles('camera/opencv/**') }}
      - name: Install OpenCV
        if: ${{ steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: mise run install-opencv
        env:
          MISE_TASK_RUN_AUTO_INSTALL: '0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: check
        run: ./gradlew :app:check
