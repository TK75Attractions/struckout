name: Nightly Release

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00, 03:00 in Japan
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-build:
    strategy:
      matrix:
        os: ["windows-2022", "macos-14", "ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .cargo
            .mise
            api/proto
            api/rust
            api/spec
            ball_tracker
            game_master
            migrations/mysql
            touchpanel
            xtask
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - uses: jdx/mise-action@b90b6cbe247d74ecfb150e2f246c091da4d5174f
        with:
          install_args: protoc
      - name: Install fontconfig for Linux
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Build
        run: SQLX_OFFLINE=true mise exec protoc -- cargo build --release -p ball_tracker -p touchpanel
      
      - name: Upload ball-tracker (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'windows-2022' }}
        with:
          name: ball-tracker-x86_64-windows
          path: ./target/release/ball_tracker.exe
      - name: Upload touchpanel (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'windows-2022' }}
        with:
          name: touchpanel-x86_64-windows
          path: ./target/release/touchpanel.exe
          
      - name: Upload ball-tracker (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'macos-14' }} 
        with:
          name: ball-tracker-aarch64-macos
          path: ./target/release/ball_tracker
      - name: Upload touchpanel (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'macos-14' }}
        with:
          name: touchpanel-aarch64-macos
          path: ./target/release/touchpanel

      - name: Upload ball-tracker (Linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          name: ball-tracker-x86_64-linux
          path: ./target/release/ball_tracker
      - name: Upload touchpanel (Linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          name: touchpanel-x86_64-linux
          path: ./target/release/touchpanel

  unity-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-platform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projector
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-
      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target-platform }}
          projectPath: projector
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projector-${{ matrix.target-platform }}
          path: ./build/
  
  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}
    needs: [rust-build, unity-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .
      - uses: actions/download-artifact@v8
      - name: Remove old release
        # continue even when there's no previous release
        run: gh release delete nightly -y --cleanup-tag || true 
        env: 
          GH_TOKEN: ${{ github.token }}
      - name: Create release
        run: |
          mkdir upload

          mv touchpanel-x86_64-linux/touchpanel upload/touchpanel-x86_64-linux
          mv ball-tracker-x86_64-linux/ball_tracker upload/ball-tracker-x86_64-linux
          mv touchpanel-x86_64-windows/touchpanel.exe upload/touchpanel-x86_64-windows.exe
          mv ball-tracker-x86_64-windows/ball_tracker.exe upload/ball-tracker-x86_64-windows.exe
          mv touchpanel-aarch64-macos/touchpanel upload/touchpanel-aarch64-macos
          mv ball-tracker-aarch64-macos/ball_tracker upload/ball-tracker-aarch64-macos
          
          gh release create nightly --notes "nightly release" upload/*
        env:
          GH_TOKEN: ${{ github.token }}
