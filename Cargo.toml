[workspace]
resolver = "3"
members = [
  "api/rust/proto",
  "api/rust/utils",
  "ball_tracker",
  "game_master",
  "touchpanel",
  "touchpanel/ui",
  "xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
struckout-proto = { path = "./api/rust/proto" }
struckout-utils = { path = "./api/rust/utils" }

async-stream = "0.3.6"
backon = "1.6.0"
futures-util = "0.3"
sentry = { version = "0.49.3", features = ["tracing"] }
tokio = "1.52.3"
tokio-stream = "0.1.19"
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

anyhow = "1.0"
approx = "0.5.1"
bytes = "1.11.1"
chrono = "0.4.44"
clap = "4.6.1"
derive-getters = "0.5.0"
derive_more = "2.1.1"
dirs = "7.0.0"
enum_dispatch = "0.3.13"
heck = "0.5.0"
itertools = "0.15.0"
octocrab = "0.54.5"
parking_lot = "0.12.5"
pastey = "0.2.3"
rand = "0.10.1"
serde = "1.0"
serde_json = "1.0"
serde-saphyr = "2.0.0"
sqlx = "0.9.0"
strum = "0.28.0"
tempfile = "3"
thiserror = "2.0.18"
time = "0.3.55"
toml = "1.1.5"
uuid = "1.23.4"

prost = "0.14.3"
prost-build = "0.14.3"
prost-types = "0.14.4"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

i-slint-backend-testing = { git = "https://github.com/Tk75Attractions/slint" }
i-slint-compiler = { git = "https://github.com/Tk75Attractions/slint" }
i-slint-core = { git = "https://github.com/Tk75Attractions/slint" }
# slint
slint = { git = "https://github.com/Tk75Attractions/slint" }
slint-build = { git = "https://github.com/Tk75Attractions/slint" }
stern = { git = "https://github.com/Tk75Attractions/stern" }

mockall = "0.15.0"
rstest = "0.27.0"
# dev-dependencies
testcontainers-modules = "0.15.0"

[profile.dev.package.slint]
opt-level = 3

[profile.dev.package.slint-build]
opt-level = 3

[profile.dev.package.sqlx-macros]
opt-level = 3
