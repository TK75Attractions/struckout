[package]
name = "touchpanel"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
stern = { workspace = true }
struckout-proto = { workspace = true }
touchpanel-ui = { path = "./ui/" }

async-stream = { workspace = true }
backon = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
sentry = { workspace = true, optional = true }
tokio = {
  workspace = true,
  features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "test-util",
    "time",
  ]
}
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "string"] }
derive-getters = { workspace = true, features = ["auto_copy_getters"] }
derive_more = { workspace = true, features = ["debug"] }
enum_dispatch = { workspace = true }
itertools = { workspace = true }
pastey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

i-slint-core = { workspace = true }
slint = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
mockall = { workspace = true }
rstest = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
struckout-utils = { workspace = true }

[features]
sentry = ["dep:sentry"]
