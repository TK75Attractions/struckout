[package]
name = "touchpanel"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
struckout-proto = { workspace = true }
stern = { workspace = true }
touchpanel-ui = { path = "./ui/" }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "io-util",
    "macros",
    "test-util",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
backon = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
async-stream = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
itertools = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
derive-getters = { workspace = true, features = ["auto_copy_getters"] }
pastey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
strum = { workspace = true, features = ["derive"] }
enum_dispatch = { workspace = true }
clap = { workspace = true, features = ["derive"] }

i-slint-core = { workspace = true }
slint = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
struckout-yaml = { workspace = true }
