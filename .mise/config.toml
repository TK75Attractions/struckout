[tools]
# Languages
java = "temurin-21"
"rust" = "latest"
dotnet = "10"

# Tools

# projectorのGoogle.Protobufのバージョンと合わせる
protoc = "35.1"

# 生成したファイルをコミットしているので環境による差異が出ないよう固定する
buf = "1.72.0"

"cargo:slint-viewer" = "latest"
"cargo:sqlx-cli" = "latest"
tokei = "latest"
grpcurl = "latest"

[tasks.proto]
# grpc_csharp_plugin は buf.gen.game-master.yaml が BSR の remote plugin を使うので、
# ローカルに用意するものは buf と protoc だけ。
run = [
    "buf generate --template buf.gen.ball-tracker.yaml",
    "buf generate --template buf.gen.game-master.yaml",
]
description = "Generate the committed C# from api/proto"

[tasks."proto:check"]
depends = ["proto"]
run = "git diff --exit-code -- projector/Assets/Scripts/ProtoBuf/Generated sandbox/testTcpCLI/Network/Protocol/Generated"
description = "Check the committed C# matches api/proto (regenerates in place)"

[tasks."game-master:dev"]
run = "docker compose --env-file .env.dev -f compose.yaml -f compose.dev.yaml up"
dir = "game_master/"
description = "Start a dev server of game-master using docker-compose"

[tasks."game-master:prod"]
run = "docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up"
dir = "game_master/"
description = "Start a production server of game-master using docker-compose"

[tasks."game-master:db"]
run = "docker compose --env-file .env.dev -f compose.yaml -f compose.dev.yaml up db"
dir = "game_master/"
description = "Start a MySQL service for game-master."

[tasks."game-master:build"]
depends = ["escape-patches", "game-master:prepare"]
depends_post = "post-escape-patches"
run = "docker compose --env-file .env.dev -f compose.yaml -f compose.dev.yaml build"
dir = "game_master/"
description = "game-masterをビルドする"

[tasks."game-master:prepare"]
run = "cargo sqlx prepare"
dir = "game_master/"
description = "game-masterのクエリ検証用メタデータを生成する"

[tasks."escape-patches"]
run = """
    if [ -f ./patches.toml ]; then
        mv ./patches.toml ./patches.toml.bak
    fi
"""
dir = ".cargo/"
description = ".cargo/patches.tomlを一時的に退避する"
hide = true

[tasks."post-escape-patches"]
run = """
    if [ -f ./patches.toml.bak ]; then
        mv ./patches.toml.bak ./patches.toml
    fi
"""
dir = ".cargo/"
description = "'escape-patches'で移動したファイルを元に戻す"
hide = true

[tasks."adb-reverse"]
file = "scripts/adb-reverse.sh"
description = "接続されたそれぞれのデバイスに対し'adb reverse'を実行する"
