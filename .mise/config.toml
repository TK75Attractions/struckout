[tools]
# Languages
java = "temurin-21"
"rust" = "latest"
dotnet = "10"

# Tools

# projectorのGoogle.Protobufのバージョンと合わせる
protoc = "35.1"

# 生成したファイルをコミットしているので環境による差異が出ないよう固定する
buf = "1.72.0"

"cargo:slint-viewer" = "latest"
"cargo:slint-lsp" = "latest"
"cargo:sqlx-cli" = "latest"
tokei = "latest"
grpcurl = "latest"

[tasks.proto]
# grpc_csharp_plugin は buf.gen.game-master.yaml が BSR の remote plugin を使うので、
# ローカルに用意するものは buf と protoc だけ。
run = [
    "buf generate --template buf.gen.ball-tracker.yaml",
    "buf generate --template buf.gen.game-master.yaml",
]
description = "Generate the committed C# from api/proto"

[tasks."proto:check"]
depends = ["proto"]
run = "git diff --exit-code -- projector/Assets/Scripts/ProtoBuf/Generated sandbox/testTcpCLI/Network/Protocol/Generated"
description = "Check the committed C# matches api/proto (regenerates in place)"

[tasks."touchpanel:fmt-slint"]
run = "find -name '*.slint' | xargs slint-lsp format --inline"
dir = "touchpanel/ui/"
description = "touchpanelのslintファイルを整形する"

[tasks."touchpanel:new"]
run = '''
cargo xtask --verbose new
'''
dir = "touchpanel/"
description = "Create new screen in touchpanel"

[tasks."patches:disable"]
run = """
    if [ -f ./patches.toml ]; then
        mv ./patches.toml ./patches.toml.bak
    fi
"""
dir = ".cargo/"
description = ".cargo/patches.tomlを一時的に退避する"

[tasks."patches:enable"]
run = """
    if [ -f ./patches.toml.bak ]; then
        mv ./patches.toml.bak ./patches.toml
    fi
"""
dir = ".cargo/"
description = "'patches:disable'で移動したファイルを元に戻す"

[tasks."patches:status"]
run = """
    if [ -f ./patches.toml ]; then
        echo "patch enabled"
    elif [ -f ./patches.toml.bak ]; then
        echo "patch disabled"
    else
        echo "no patch config"
    fi
"""
dir = ".cargo/"
description = ".cargo/patches.tomlの状態を表示する"

[tasks."adb-reverse"]
file = "scripts/adb-reverse.sh"
description = "接続されたそれぞれのデバイスに対し'adb reverse'を実行する"

[settings]
lockfile = true
