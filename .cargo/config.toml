include = [
  # ローカル限定で依存関係をオーバーライドしたいときに使う (Cargo.tomlをいじってコミットする前に戻す、とかをしなくて済む)。
  { path = "./patches.toml", optional = true },
]

[alias]
xtask = "run -p xtask --"

# mold is configured only for x86_64 because the locked tool does not provide a Linux ARM64 build.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
